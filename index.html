<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
<meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
<meta http-equiv="Pragma" content="no-cache">
<meta http-equiv="Expires" content="0">
<title>라커룸 찾기</title>

<!-- 홈 화면에 추가했을 때 앱처럼 보이도록 -->
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="라커룸 찾기">
<meta name="mobile-web-app-capable" content="yes">

<link rel="manifest" href="manifest.json">

<script>
  // ============================================================
  // ✏️ 여기에 구글 앱스크립트 배포 URL을 넣으세요
  // (배포 > 새 배포 > 웹 앱 배포 후 나오는 https://script.google.com/macros/s/.../exec 형태의 주소)
  // ============================================================
  const SCRIPT_URL = "https://script.google.com/macros/s/AKfycbwQsP3_JJTmG4SceRCwNiKVUdJPjdMkdst-3Urmd1euessReNkQcqvPo6J7vGP50u17qA/exec";

  const LABELS = [
    {text:"출입구", col:1, row:9, colSpan:3, kind:"entrance"},
    {text:"샤워실", col:21, row:8, colSpan:2, kind:"room"},
    {text:"샤워실입구", col:21, row:15, colSpan:2, kind:"room-small"},
  ];
  const GRID_COLS = 23;
  const GRID_ROWS = 22;
</script>

<div id="app"></div>

<style>
  :root{
    --bg1:#e9edf3; --bg2:#f6f8fb; --panel:#ffffff; --line:#c7d0dc;
    --paper:#1c2531; --paper-dim:#5b6779; --brass:#b8873c; --brass-bright:#8a5f14;
    --wall:#e2e7ee; --room:#eef1f6; --ok:#1f9d6e; --danger:#d94f39;
  }
  *{box-sizing:border-box;}
  html,body{
    margin:0;padding:0;
    background:linear-gradient(180deg, #eef1f6 0%, #dfe5ee 100%);
    color:var(--paper);
    font-family:-apple-system,BlinkMacSystemFont,"Pretendard","Apple SD Gothic Neo","Malgun Gothic",sans-serif;
    height:100vh; overflow:hidden;
    -webkit-tap-highlight-color:transparent;
    overscroll-behavior:none;
  }
  #app{ display:flex; flex-direction:column; height:100vh; }

  .hdr{ padding:12px 14px 10px; border-bottom:1px solid var(--line); flex-shrink:0; display:flex; justify-content:space-between; align-items:flex-start; background:var(--panel);}
  .hdr .eyebrow{ font-size:10px; letter-spacing:.16em; color:var(--brass); text-transform:uppercase; font-weight:700; margin-bottom:2px;}
  .hdr h1{ margin:0; font-size:19px; font-weight:800; color:#10151d;}
  .sync{ font-size:11px; color:var(--paper-dim); }
  .sync.loading::before{ content:"⏳ "; }
  .sync.ok::before{ content:"✓ "; color:var(--ok); }
  .sync.err{ color:var(--danger); }
  .sync.err::before{ content:"⚠ "; }

  .searchbar{ display:flex; gap:8px; padding:10px 14px 0; flex-shrink:0; }
  .search-input-wrap{ flex:1; position:relative; display:flex; align-items:center; }
  .search-input-wrap svg{ position:absolute; left:12px; width:15px;height:15px; color:var(--paper-dim); pointer-events:none;}
  #searchInput{ width:100%; background:var(--panel); border:1px solid var(--line); border-radius:10px; color:var(--paper); font-size:16px; padding:12px 12px 12px 34px; outline:none;}
  #searchInput:focus{ border-color:var(--brass); }
  .clear-btn{ position:absolute; right:9px; width:20px;height:20px; border:none; background:var(--wall); color:var(--paper-dim); border-radius:50%; font-size:13px; cursor:pointer; display:none; align-items:center; justify-content:center;}
  .clear-btn.show{ display:flex; }
  #micBtn{ flex-shrink:0; width:44px;height:44px; border-radius:10px; border:1px solid var(--line); background:var(--panel); color:var(--paper); display:flex;align-items:center;justify-content:center; cursor:pointer;}
  #micBtn.listening{ background:#e8654f; border-color:#e8654f; animation:pulseMic 1.1s ease-in-out infinite;}
  @keyframes pulseMic{ 0%,100%{ box-shadow:0 0 0 0 rgba(232,101,79,.5);} 50%{ box-shadow:0 0 0 8px rgba(232,101,79,0);} }

  .banner{ margin:10px 14px 0; padding:12px 14px; border-radius:12px; background:#fff7e6; border:1px solid var(--brass); display:none; flex-shrink:0;}
  .banner.show{ display:block; }
  .banner.empty{ border-color:var(--danger); background:#fdeeec;}
  .banner .bname{ font-size:22px; font-weight:800; color:#7a4f10;}
  .banner.empty .bname{ color:#b23b28; font-size:15px; font-weight:600;}
  .banner .bzone{ margin-top:2px; font-size:13px; color:var(--paper-dim);}
  .banner .bchips{ margin-top:10px; display:flex; flex-wrap:wrap; gap:6px; }
  .banner .bchip{ padding:7px 12px; border-radius:999px; background:#fff; border:1px solid var(--brass); color:#7a4f10; font-size:13px; font-weight:700; cursor:pointer; }
  .banner .bchip:active{ background:var(--brass); color:#fff; }

  .stage{ flex:1; overflow:auto; padding:16px; -webkit-overflow-scrolling:touch; background:linear-gradient(180deg, #eef1f6 0%, #dfe5ee 100%);}
  .floor{ display:grid; gap:3px; width:max-content; }

  .locker{ position:relative; background:var(--panel); border:1px solid var(--line); border-radius:4px; display:flex; align-items:center; justify-content:center; text-align:center; padding:1px; overflow:visible; transition:opacity .2s ease, transform .25s ease, box-shadow .25s ease; cursor:pointer; box-shadow:0 1px 2px rgba(20,30,45,.06);}
  .locker .name{ font-size:10.5px; font-weight:700; line-height:1.15; color:#1c2531; word-break:keep-all; white-space:normal;}
  .locker.dim{ opacity:.28; }
  .locker.active{ z-index:5; border-color:var(--brass); transform:scale(1.35); animation:lockerGlow 1.2s ease-in-out infinite;}
  .locker.active .name{ color:#5c3d09; font-size:11.5px; }
  @keyframes lockerGlow{
    0%,100%{ box-shadow:0 0 0 2px rgba(184,135,60,.9), 0 4px 16px 2px rgba(184,135,60,.35);}
    50%{ box-shadow:0 0 0 3px rgba(184,135,60,1), 0 6px 26px 8px rgba(184,135,60,.6);}
  }

  .label{ display:flex; align-items:center; justify-content:center; font-weight:800; color:var(--paper-dim); text-align:center;}
  .label.entrance{ font-size:13px; color:var(--brass-bright); border-top:2px dashed var(--brass); align-items:flex-start; padding-top:4px;}
  .label.entrance::before{ content:"⟵ "; }
  .label.room{ font-size:14px; color:var(--paper-dim); background:var(--room); border-radius:8px; border:1px solid var(--line);}
  .label.room-small{ font-size:10px; color:var(--paper-dim); }

  .modal-backdrop{ position:fixed; inset:0; background:rgba(20,25,35,.45); display:none; align-items:flex-end; z-index:50;}
  .modal-backdrop.show{ display:flex; }
  .modal{ width:100%; background:var(--panel); border-top:1px solid var(--line); border-radius:16px 16px 0 0; padding:18px 18px 26px; }
  .modal .mtitle{ font-size:12px; color:var(--paper-dim); margin-bottom:8px; }
  .modal input{ width:100%; background:#f3f5f9; border:1px solid var(--line); border-radius:10px; color:var(--paper); font-size:17px; padding:12px; outline:none; margin-bottom:12px;}
  .modal input:focus{ border-color:var(--brass); }
  .modal .row{ display:flex; gap:8px; }
  .modal button{ flex:1; padding:12px; border-radius:10px; border:none; font-size:15px; font-weight:700; cursor:pointer;}
  .modal .btn-save{ background:var(--brass); color:#fff; }
  .modal .btn-cancel{ background:var(--wall); color:var(--paper); }
</style>

<script>
let LOCKERS = [];
let currentMatches = [];

function renderApp(){
  const app = document.getElementById('app');
  app.innerHTML = `
    <div class="hdr">
      <div>
        <div class="eyebrow">LOCKER ROOM MAP</div>
        <h1>라커룸 찾기</h1>
      </div>
      <div style="display:flex; align-items:center; gap:8px;">
        <button id="requestsBtn" style="display:none; position:relative; font-size:11px; font-weight:700; color:#7a4f10; background:#fff7e6; border:1px solid var(--brass); border-radius:8px; padding:6px 10px; cursor:pointer;">
          요청함 <span id="reqCount" style="display:none; background:#d94f39; color:#fff; border-radius:999px; padding:1px 6px; font-size:10px; margin-left:2px;"></span>
        </button>
        <button id="adminBtn" title="관리자 모드" style="font-size:15px; background:none; border:none; cursor:pointer; padding:4px;">🔒</button>
        <button id="installBtn" style="display:none; font-size:11px; font-weight:700; color:#7a4f10; background:#fff7e6; border:1px solid var(--brass); border-radius:8px; padding:6px 10px; cursor:pointer;">
          + 홈 화면에 추가
        </button>
        <div class="sync loading" id="syncStatus">불러오는 중</div>
      </div>
    </div>
    <div class="searchbar">
      <div class="search-input-wrap">
        <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2"><circle cx="11" cy="11" r="7"/><line x1="21" y1="21" x2="16.65" y2="16.65"/></svg>
        <input id="searchInput" type="text" placeholder="이름 검색" autocomplete="off" />
        <button class="clear-btn" id="clearBtn">✕</button>
      </div>
      <button id="micBtn" aria-label="음성 검색">
        <svg viewBox="0 0 24 24" width="18" height="18" fill="none" stroke="currentColor" stroke-width="2">
          <path d="M12 1a3 3 0 0 0-3 3v8a3 3 0 0 0 6 0V4a3 3 0 0 0-3-3z"/>
          <path d="M19 10v2a7 7 0 0 1-14 0v-2"/>
          <line x1="12" y1="19" x2="12" y2="23"/>
          <line x1="8" y1="23" x2="16" y2="23"/>
        </svg>
      </button>
    </div>

    <div class="banner" id="banner">
      <div class="bname" id="bname"></div>
      <div class="bzone" id="bzone"></div>
      <div class="bchips" id="bchips"></div>
    </div>

    <div class="stage" id="stage">
      <div class="floor" id="floor"></div>
    </div>

    <div class="modal-backdrop" id="modalBackdrop">
      <div class="modal">
        <div class="mtitle" id="modalMeta">위치 정보</div>
        <input id="modalInput" type="text" placeholder="이름 입력" />
        <div class="row">
          <button class="btn-cancel" id="modalCancel">취소</button>
          <button class="btn-save" id="modalSave">저장</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="pinBackdrop">
      <div class="modal">
        <div class="mtitle">관리자 PIN 입력</div>
        <input id="pinInput" type="tel" inputmode="numeric" placeholder="PIN 번호" />
        <div class="row">
          <button class="btn-cancel" id="pinCancel">취소</button>
          <button class="btn-save" id="pinSubmit">확인</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="requestsBackdrop">
      <div class="modal" style="max-height:70vh; overflow:auto;">
        <div class="mtitle">대기 중인 변경 요청</div>
        <div id="requestsList" style="display:flex; flex-direction:column; gap:10px; margin-bottom:14px;"></div>
        <div class="row">
          <button class="btn-cancel" id="requestsClose" style="flex:1;">닫기</button>
        </div>
      </div>
    </div>

    <div class="modal-backdrop" id="iosBackdrop">
      <div class="modal">
        <div class="mtitle">홈 화면에 추가하는 방법</div>
        <p style="font-size:14px; line-height:1.7; margin:0 0 14px;">
          아이폰은 자동 설치가 막혀있어서 손으로 두 단계만 해주시면 돼요.<br><br>
          1️⃣ 화면 하단(또는 상단) <b>공유 버튼</b>(⬆️ 상자 모양)을 누르세요<br>
          2️⃣ 아래로 내려서 <b>"홈 화면에 추가"</b>를 누르세요
        </p>
        <div class="row">
          <button class="btn-save" id="iosClose" style="flex:1;">확인했어요</button>
        </div>
      </div>
    </div>
  `;

  const floor = document.getElementById('floor');
  floor.style.gridTemplateColumns = `repeat(${GRID_COLS},42px)`;
  floor.style.gridTemplateRows = `repeat(${GRID_ROWS},42px)`;

  loadData();
  wireSearch();
  wireModal();
  wireAdmin();
}

function drawFloor(){
  const floor = document.getElementById('floor');
  floor.innerHTML =
    LOCKERS.map(l => `
      <div class="locker" data-name="${l.name}" data-zone="${l.zone}" data-col="${l.col}" data-row="${l.row}">
        <div class="name">${l.name}</div>
      </div>
    `).join('') +
    LABELS.map(lb => `
      <div class="label ${lb.kind}" style="grid-column:${lb.col} / span ${lb.colSpan};grid-row:${lb.row};">
        ${lb.text}
      </div>
    `).join('');

  Array.from(document.querySelectorAll('.locker')).forEach((el,i) => {
    const l = LOCKERS[i];
    el.style.gridColumn = l.col;
    el.style.gridRow = l.row;
    el.addEventListener('click', () => openEditModal(el));
  });
}

async function loadData(){
  const syncStatus = document.getElementById('syncStatus');
  syncStatus.textContent = '불러오는 중';
  syncStatus.className = 'sync loading';

  if (!SCRIPT_URL || SCRIPT_URL.indexOf('http') !== 0) {
    syncStatus.textContent = 'SCRIPT_URL 설정 필요';
    syncStatus.className = 'sync err';
    return;
  }

  try {
    const res = await fetch(SCRIPT_URL + '?action=list');
    const data = await res.json();
    LOCKERS = data;
    drawFloor();
    syncStatus.textContent = '동기화됨';
    syncStatus.className = 'sync ok';
  } catch (err) {
    console.error(err);
    syncStatus.textContent = '불러오기 실패';
    syncStatus.className = 'sync err';
  }
}

function wireSearch(){
  const searchInput = document.getElementById('searchInput');
  const clearBtn = document.getElementById('clearBtn');
  const banner = document.getElementById('banner');
  const bname = document.getElementById('bname');
  const bzone = document.getElementById('bzone');
  const bchips = document.getElementById('bchips');
  const stage = document.getElementById('stage');

  function clearHighlights(){
    Array.from(document.querySelectorAll('.locker')).forEach(el => el.classList.remove('active','dim'));
  }

  function focusOne(el){
    clearHighlights();
    Array.from(document.querySelectorAll('.locker')).forEach(x => {
      if(x === el) x.classList.add('active');
      else x.classList.add('dim');
    });
    bname.textContent = el.dataset.name;
    bzone.textContent = el.dataset.zone;
    bchips.innerHTML = '';

    const stageRect = stage.getBoundingClientRect();
    const targetRect = el.getBoundingClientRect();
    stage.scrollTo({
      left: stage.scrollLeft + (targetRect.left - stageRect.left) - stageRect.width/2 + targetRect.width/2,
      top: stage.scrollTop + (targetRect.top - stageRect.top) - stageRect.height/2 + targetRect.height/2,
      behavior:'smooth'
    });
  }

  function runSearch(query){
    const q = query.trim();
    clearHighlights();
    bchips.innerHTML = '';

    if(!q){
      banner.classList.remove('show','empty');
      clearBtn.classList.remove('show');
      return;
    }
    clearBtn.classList.add('show');
    const lockerEls = Array.from(document.querySelectorAll('.locker'));
    const matches = lockerEls.filter(el => el.dataset.name.includes(q));
    currentMatches = matches;
    banner.classList.add('show');

    if(matches.length === 0){
      banner.classList.add('empty');
      bname.textContent = `"${q}" 를 찾지 못했어요`;
      bzone.textContent = '이름을 다시 확인해주세요';
      lockerEls.forEach(el => el.classList.add('dim'));
      return;
    }

    banner.classList.remove('empty');

    if(matches.length === 1){
      focusOne(matches[0]);
      return;
    }

    // 여러 명 매치 -> 선택하도록 칩으로 보여주고, 일단 첫 번째로 이동
    bname.textContent = `${matches.length}명 찾음 — 아래에서 선택하세요`;
    bzone.textContent = '';
    bchips.innerHTML = matches.map((m,i) => `<div class="bchip" data-idx="${i}">${m.dataset.name} · ${m.dataset.zone}</div>`).join('');
    Array.from(bchips.querySelectorAll('.bchip')).forEach(chip => {
      chip.addEventListener('click', () => focusOne(matches[Number(chip.dataset.idx)]));
    });

    lockerEls.forEach(el => {
      if(matches.includes(el)) el.classList.add('active');
      else el.classList.add('dim');
    });
    const target = matches[0];
    const stageRect = stage.getBoundingClientRect();
    const targetRect = target.getBoundingClientRect();
    stage.scrollTo({
      left: stage.scrollLeft + (targetRect.left - stageRect.left) - stageRect.width/2 + targetRect.width/2,
      top: stage.scrollTop + (targetRect.top - stageRect.top) - stageRect.height/2 + targetRect.height/2,
      behavior:'smooth'
    });
  }

  searchInput.addEventListener('input', e => runSearch(e.target.value));
  clearBtn.addEventListener('click', () => { searchInput.value=''; runSearch(''); searchInput.focus(); });

  const micBtn = document.getElementById('micBtn');
  const SpeechRecognition = window.SpeechRecognition || window.webkitSpeechRecognition;
  if(!SpeechRecognition){
    micBtn.addEventListener('click', () => {
      banner.classList.add('show','empty');
      bname.textContent = '이 브라우저는 음성 검색을 지원하지 않아요';
      bzone.textContent = '';
    });
  } else {
    const recognition = new SpeechRecognition();
    recognition.lang = 'ko-KR';
    recognition.interimResults = false;
    recognition.maxAlternatives = 1;
    let listening = false;
    recognition.onstart = () => {
      listening = true;
      micBtn.classList.add('listening');
      banner.classList.add('show'); banner.classList.remove('empty');
      bname.textContent = '듣고 있어요...'; bzone.textContent = ''; bchips.innerHTML='';
    };
    recognition.onresult = (event) => {
      const transcript = event.results[0][0].transcript.trim();
      searchInput.value = transcript;
      runSearch(transcript);
    };
    recognition.onerror = () => {
      banner.classList.add('show','empty');
      bname.textContent = '음성을 인식하지 못했어요'; bzone.textContent = '다시 시도해주세요';
    };
    recognition.onend = () => { listening = false; micBtn.classList.remove('listening'); };
    micBtn.addEventListener('click', () => {
      if(listening) recognition.stop();
      else { try{ recognition.start(); }catch(e){} }
    });
  }
}

function openEditModal(lockerEl){
  editingTarget = lockerEl;
  const isAdmin = !!localStorage.getItem('lockerAdminPin');
  document.getElementById('modalMeta').textContent =
    `${lockerEl.dataset.zone} · ${lockerEl.dataset.col}열 ${lockerEl.dataset.row}행` +
    (isAdmin ? '' : ' · 이름이 틀렸다면 변경을 요청할 수 있어요');
  document.getElementById('modalInput').value = lockerEl.dataset.name;
  document.getElementById('modalSave').textContent = isAdmin ? '저장' : '변경 요청 보내기';
  document.getElementById('modalBackdrop').classList.add('show');
  setTimeout(() => document.getElementById('modalInput').focus(), 50);
}
function closeModal(){
  document.getElementById('modalBackdrop').classList.remove('show');
  editingTarget = null;
}

function wireModal(){
  document.getElementById('modalCancel').addEventListener('click', closeModal);
  document.getElementById('modalBackdrop').addEventListener('click', (e) => {
    if(e.target.id === 'modalBackdrop') closeModal();
  });
  document.getElementById('modalSave').addEventListener('click', async () => {
    if(!editingTarget) return;
    const newName = document.getElementById('modalInput').value.trim();
    if(!newName) return;

    const col = editingTarget.dataset.col;
    const row = editingTarget.dataset.row;
    const oldName = editingTarget.dataset.name;
    const pin = localStorage.getItem('lockerAdminPin');
    const isAdmin = !!pin;

    const saveBtn = document.getElementById('modalSave');
    const originalLabel = saveBtn.textContent;
    saveBtn.textContent = '처리 중...';
    saveBtn.disabled = true;

    try {
      const payload = isAdmin
        ? { action: 'update', col: Number(col), row: Number(row), name: newName, pin }
        : { action: 'request', col: Number(col), row: Number(row), oldName, name: newName };

      const res = await fetch(SCRIPT_URL, {
        method: 'POST',
        headers: { 'Content-Type': 'text/plain;charset=utf-8' },
        body: JSON.stringify(payload)
      });
      const result = await res.json();
      if(!result.ok) throw new Error(result.error || 'unknown error');

      if (isAdmin) {
        editingTarget.dataset.name = newName;
        editingTarget.querySelector('.name').textContent = newName;
        const idx = LOCKERS.findIndex(l => l.col == col && l.row == row);
        if(idx > -1) LOCKERS[idx].name = newName;
      } else {
        alert('변경 요청을 보냈어요. 관리자가 확인 후 반영할게요.');
      }
      closeModal();
    } catch (err) {
      alert('처리 실패: ' + err.message);
    } finally {
      saveBtn.textContent = originalLabel;
      saveBtn.disabled = false;
    }
  });
}

function wireAdmin(){
  const adminBtn = document.getElementById('adminBtn');
  const pinBackdrop = document.getElementById('pinBackdrop');
  const pinInput = document.getElementById('pinInput');
  const pinCancel = document.getElementById('pinCancel');
  const pinSubmit = document.getElementById('pinSubmit');
  const requestsBtn = document.getElementById('requestsBtn');
  const reqCount = document.getElementById('reqCount');
  const requestsBackdrop = document.getElementById('requestsBackdrop');
  const requestsList = document.getElementById('requestsList');
  const requestsClose = document.getElementById('requestsClose');

  function refreshAdminUI(){
    const isAdmin = !!localStorage.getItem('lockerAdminPin');
    adminBtn.textContent = isAdmin ? '🔓' : '🔒';
    requestsBtn.style.display = isAdmin ? 'inline-flex' : 'none';
    if (isAdmin) refreshRequestCount();
  }

  adminBtn.addEventListener('click', () => {
    if (localStorage.getItem('lockerAdminPin')) {
      localStorage.removeItem('lockerAdminPin');
      refreshAdminUI();
      return;
    }
    pinBackdrop.classList.add('show');
    setTimeout(() => pinInput.focus(), 50);
  });
  pinCancel.addEventListener('click', () => pinBackdrop.classList.remove('show'));
  pinBackdrop.addEventListener('click', (e) => { if(e.target.id === 'pinBackdrop') pinBackdrop.classList.remove('show'); });

  pinSubmit.addEventListener('click', async () => {
    const pin = pinInput.value.trim();
    if(!pin) return;
    pinSubmit.textContent = '확인 중...';
    try {
      const res = await fetch(SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'checkPin', pin })
      });
      const result = await res.json();
      if (result.ok) {
        localStorage.setItem('lockerAdminPin', pin);
        pinBackdrop.classList.remove('show');
        pinInput.value = '';
        refreshAdminUI();
      } else {
        alert('PIN이 올바르지 않아요.');
      }
    } catch(err) {
      alert('확인 실패: ' + err.message);
    } finally {
      pinSubmit.textContent = '확인';
    }
  });

  async function refreshRequestCount(){
    const pin = localStorage.getItem('lockerAdminPin');
    if(!pin) return;
    try {
      const res = await fetch(SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action:'listRequests', pin })
      });
      const result = await res.json();
      if(result.ok && result.requests.length > 0){
        reqCount.style.display = 'inline-block';
        reqCount.textContent = result.requests.length;
      } else {
        reqCount.style.display = 'none';
      }
      return result.requests || [];
    } catch(err){ return []; }
  }

  async function openRequestsPanel(){
    const pin = localStorage.getItem('lockerAdminPin');
    const requests = await refreshRequestCount();
    requestsList.innerHTML = requests.length === 0
      ? '<div style="font-size:13px; color:var(--paper-dim);">대기 중인 요청이 없어요.</div>'
      : requests.map(r => `
        <div style="border:1px solid var(--line); border-radius:10px; padding:10px;" data-id="${r.requestId}">
          <div style="font-size:13px; color:var(--paper-dim); margin-bottom:4px;">${r.col}열 ${r.row}행</div>
          <div style="font-size:15px; font-weight:700;">${r.oldName} → <span style="color:#7a4f10;">${r.requestedName}</span></div>
          <div class="row" style="margin-top:8px;">
            <button class="btn-cancel req-reject" data-id="${r.requestId}">거절</button>
            <button class="btn-save req-approve" data-id="${r.requestId}">승인</button>
          </div>
        </div>
      `).join('');

    Array.from(requestsList.querySelectorAll('.req-approve')).forEach(btn => {
      btn.addEventListener('click', () => handleRequestAction(btn.dataset.id, 'approve'));
    });
    Array.from(requestsList.querySelectorAll('.req-reject')).forEach(btn => {
      btn.addEventListener('click', () => handleRequestAction(btn.dataset.id, 'reject'));
    });

    requestsBackdrop.classList.add('show');
  }

  async function handleRequestAction(requestId, action){
    const pin = localStorage.getItem('lockerAdminPin');
    try {
      const res = await fetch(SCRIPT_URL, {
        method:'POST',
        headers:{'Content-Type':'text/plain;charset=utf-8'},
        body: JSON.stringify({ action, requestId: Number(requestId), pin })
      });
      const result = await res.json();
      if(!result.ok) throw new Error(result.error || 'unknown error');
      if (action === 'approve') await loadData(); // 화면에 바로 반영
      openRequestsPanel(); // 목록 새로고침
    } catch(err) {
      alert('처리 실패: ' + err.message);
    }
  }

  requestsBtn.addEventListener('click', openRequestsPanel);
  requestsClose.addEventListener('click', () => requestsBackdrop.classList.remove('show'));
  requestsBackdrop.addEventListener('click', (e) => { if(e.target.id === 'requestsBackdrop') requestsBackdrop.classList.remove('show'); });

  refreshAdminUI();
}


renderApp();
wireInstall();

function isIos(){
  return /iphone|ipad|ipod/i.test(navigator.userAgent) && !window.MSStream;
}
function isStandalone(){
  return (window.matchMedia && window.matchMedia('(display-mode: standalone)').matches) || window.navigator.standalone === true;
}

let deferredInstallPrompt = null;

function wireInstall(){
  const installBtn = document.getElementById('installBtn');
  const iosBackdrop = document.getElementById('iosBackdrop');
  const iosClose = document.getElementById('iosClose');

  if (isStandalone()) return; // 이미 홈 화면 앱으로 열려있으면 버튼 숨김

  if (isIos()) {
    installBtn.style.display = 'inline-block';
    installBtn.addEventListener('click', () => {
      iosBackdrop.classList.add('show');
    });
    iosClose.addEventListener('click', () => iosBackdrop.classList.remove('show'));
    iosBackdrop.addEventListener('click', (e) => {
      if(e.target.id === 'iosBackdrop') iosBackdrop.classList.remove('show');
    });
  } else {
    window.addEventListener('beforeinstallprompt', (e) => {
      e.preventDefault();
      deferredInstallPrompt = e;
      installBtn.style.display = 'inline-block';
    });
    installBtn.addEventListener('click', async () => {
      if (!deferredInstallPrompt) return;
      deferredInstallPrompt.prompt();
      await deferredInstallPrompt.userChoice;
      deferredInstallPrompt = null;
      installBtn.style.display = 'none';
    });
  }

  if ('serviceWorker' in navigator) {
    navigator.serviceWorker.register('sw.js').then(reg => {
      // 새 버전이 있는지 즉시 확인
      reg.update();
      // 새 서비스워커가 활성화되면(=업데이트되면) 자동으로 화면을 한 번 새로고침
      let refreshed = false;
      navigator.serviceWorker.addEventListener('controllerchange', () => {
        if (refreshed) return;
        refreshed = true;
        window.location.reload();
      });
    }).catch(() => {});
  }
}
</script>
